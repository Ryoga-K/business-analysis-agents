[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "business-analysis-agents"
version = "0.1.0"
description = "Research prototype for extracting business knowledge into RDF with OpenAI Agents SDK and SHACL validation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.19.0,<1",
    "pydantic>=2.7",
    "rdflib>=7.0",
    "pyshacl>=0.26",
    "PyMuPDF>=1.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
